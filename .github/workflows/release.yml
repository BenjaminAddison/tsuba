# Builds Tsuba for Windows and publishes it as a GitHub release.
#
# Push a version tag to cut a release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Running it by hand (Actions > Release > Run workflow) builds the same exe and
# leaves it as a run artifact. Tick "publish" there to also cut the release,
# tagged with the version in app/Cargo.toml -- the same thing the tag push does,
# for when you would rather not push a tag yourself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release, tagged with the version in app/Cargo.toml"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Build tsuba.exe
        run: cargo build --release -p tsuba

      - name: Test the backend
        run: cargo test --release -p katana

      - name: Package
        id: package
        shell: pwsh
        run: |
          # On a tag push the tag names the release; otherwise take it from the crate version.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          $name = "tsuba-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/tsuba.exe "dist/$name/"
          Copy-Item -Recurse tones "dist/$name/tones"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item target/release/tsuba.exe dist/tsuba.exe
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=dist/$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsuba-windows-x86_64
          path: |
            dist/tsuba.exe
            dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: >
          gh release create "$env:TAG"
          "dist/tsuba.exe"
          "${{ steps.package.outputs.zip }}"
          --target "$env:GITHUB_SHA"
          --title "Tsuba $env:TAG"
          --notes-file .github/release-notes.md
